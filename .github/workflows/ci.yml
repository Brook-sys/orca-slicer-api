name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go test ./...
      - run: go build ./cmd/server

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          # ATENÇÃO: linux/arm64 aqui NÃO produz imagem utilizável em ARM.
          # O Dockerfile baixa sempre o AppImage amd64 do OrcaSlicer, então a
          # imagem arm64 builda (Go compila cruzado, apt instala libs arm64) e
          # falha ao executar o slicer. Suporte real exigiria escolher o asset
          # por TARGETARCH (o upstream publica ..._aarch64_...).
          # Imagem publicada de verdade: apenas container.yml, linux/amd64.
          # Nota: este job também publica as tags main/sha-* no GHCR, repetindo
          # o que container.yml faz — as duas corridas competem pela mesma tag.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
